name: 'METplus Claude Code Review'
description: 'Review a METplus component pull request with Claude Code, posting inline comments and one summary comment'

inputs:
  claude-code-oauth-token:
    description: 'Claude Code OAuth token, normally secrets.CLAUDE_CODE_OAUTH_TOKEN'
    required: true
  pr-number:
    description: 'Number of the pull request to review'
    required: true
  effort:
    description: 'Review effort level: low, medium, high, xhigh, or max. "low" reports only a few high-confidence findings, "high" reports more, including some the reviewer is less certain about.'
    required: false
    default: 'high'
  max-turns:
    description: 'Maximum number of turns Claude may take'
    required: false
    default: '80'

runs:
  using: 'composite'
  steps:
    # The inputs are interpolated into the prompt and the command line, so
    # reject anything that is not the expected form before using them.
    - name: Check inputs
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        EFFORT: ${{ inputs.effort }}
        MAX_TURNS: ${{ inputs.max-turns }}
      run: |
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be a number: '$PR_NUMBER'"; exit 1; }
        [[ "$EFFORT" =~ ^(low|medium|high|xhigh|max)$ ]] || { echo "::error::effort must be low, medium, high, xhigh, or max: '$EFFORT'"; exit 1; }
        [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || { echo "::error::max-turns must be a number: '$MAX_TURNS'"; exit 1; }

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # Full history so the reviewer can diff against the base branch and
        # read the history of the files the pull request touches.
        fetch-depth: 0
        # A pull_request event checks out its own merge commit. Any other
        # event, such as workflow_dispatch, checks out the pull request head.
        ref: ${{ github.event_name != 'pull_request' && format('refs/pull/{0}/head', inputs.pr-number) || '' }}

    - name: Run Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        prompt: |
          /code-review ${{ inputs.effort }} ${{ inputs.pr-number }} --comment --max-findings all

          Always finish by posting exactly one top-level summary comment on
          the pull request with `gh pr comment`, whether or not any issues
          were found, and post it after any inline comments. That comment
          contains these sections, in this order:

          1. Two or three sentences describing what this pull request
             changes, in your own words rather than quoting the description.
          2. The findings, one per line, each naming the file and line the
             inline comment was posted on, so the conversation shows at a
             glance what the review flagged. Say so plainly when there are
             none.
          3. "Project conventions", judging the pull request against
             AGENTS.md in the root of this repository and the guides it
             points to: whether the pull request follows each convention
             there that applies to this change, whether the documentation
             changed when user-visible behavior did, whether the tests were
             added or updated, and the files this pull request adds,
             renames, or removes. If the repository has no AGENTS.md, say
             so and judge only the documentation, the tests, and the files.
          4. "Questions for the author", listing anything the diff alone
             could not settle. Leave the section out when there is nothing
             to ask.

          Report only what the diff and the repository support. Do not pad
          the summary to fill a section.
        # The tools the review needs: the inline comment tool, the read-only
        # gh commands that read the pull request, `gh pr comment` for the
        # summary, and the read-only git commands that give it the history of
        # the files in the diff. Read, Grep, and Glob let it read the
        # checked-out source rather than working from the diff alone. Task and
        # ReportFindings are how the review fans out to its reviewer subagents
        # and reports what they confirm.
        # The action runs in auto permission mode, where this list is an allow
        # rule rather than a strict whitelist; other tool calls are decided by
        # the action's own safety review.
        claude_args: >-
          --allowedTools
          "mcp__github_inline_comment__create_inline_comment,Task,ReportFindings,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          --max-turns ${{ inputs.max-turns }}
